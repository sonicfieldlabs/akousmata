name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: akousmata
    steps:
      - name: Checkout Akousmata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          path: akousmata
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Verify reviewed canonical dependency wheels
        run: shasum -a 256 -c vendor/SHA256SUMS

      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - name: Verify research in an ordinary installed runtime
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/akousmata-wheel"
          uv venv "$RUNNER_TEMP/akousmata-runtime"
          uv pip install --python "$RUNNER_TEMP/akousmata-runtime/bin/python" \
            --find-links vendor "$RUNNER_TEMP"/akousmata-wheel/akousmata-*.whl
          "$RUNNER_TEMP/akousmata-runtime/bin/python" -I \
            scripts/check_installed_research.py tests/fixtures/research-workflow.json
