name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: akousmata
    steps:
      - name: Checkout Akousmata
        uses: actions/checkout@v4
        with:
          path: akousmata
      - name: Checkout Earworm
        uses: actions/checkout@v4
        with:
          repository: sonicfieldlabs/earworm
          path: earworm
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
