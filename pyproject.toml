[project]
name = "akousmata"
version = "0.6.1"
description = "The listening navigator: a local-first library app over the shared akousmata store of sonic memories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "akousma>=0.6.1",
    "fastapi>=0.139",
    "python-multipart>=0.0.32",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/sonicfieldlabs/akousmata"
Repository = "https://github.com/sonicfieldlabs/akousmata"
Issues = "https://github.com/sonicfieldlabs/akousmata/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.7",
    "jsonschema>=4.21",
]

[project.scripts]
akousmata = "akousmata_app.server:main"

[tool.uv.sources]
akousma = { path = "../earworm/packages/py-akousma", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akousmata_app"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "akousmata_app/static"

# The local monorepo uses the sibling py-akousma checkout; published builds
# resolve the same canonical package from their package index.
