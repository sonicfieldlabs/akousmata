[project]
name = "akousmata"
version = "0.8.3"
description = "The listening navigator: a local-first library app over the shared akousmata store of sonic memories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "akousma>=0.8.4",
    "akouo-contract>=0.10.1",
    "numpy>=1.26",
    "soundfile>=0.12",
    "fastapi>=0.139",
    "python-multipart>=0.0.32",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/sonicfieldlabs/akousmata"
Repository = "https://github.com/sonicfieldlabs/akousmata"
Issues = "https://github.com/sonicfieldlabs/akousmata/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.12,<3",
    "jsonschema>=4.21",
]

[project.scripts]
akousmata = "akousmata_app.server:main"

[tool.uv.sources]
akouo-contract = { path = "vendor/akouo_contract-0.10.1-py3-none-any.whl" }
akousma = { path = "vendor/akousma-0.8.4-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akousmata_app"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "akousmata_app/static"

# Local development and CI use the reviewed wheels in vendor/. Package metadata
# declares the same minima without requiring sibling editable checkouts.

# Explicit source inputs exclude local reports, plans and operator state.
[tool.hatch.build.targets.sdist]
include = ["akousmata_app", "static", "pyproject.toml", "README.md", "LICENSE", "vendor/*.whl", "vendor/SHA256SUMS", "vendor/compatibility.json", "vendor/NOTICE.md"]
